name: Atualizar ofertas

on:
  push:
    branches: [main]
    paths:
      - 'config/sources.json'
      - 'scripts/collect.mjs'
      - 'scripts/lib/**'
      - 'scripts/providers/**'
      - '.github/workflows/collect.yml'
  schedule:
    # UTC: equivale a 00:17, 06:17, 12:17 e 18:17 em São Paulo.
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-offers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 10 páginas fixas e até 8 páginas de rota pedidas nos perfis, em sequência.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Coletar preços anunciados
        run: npm run collect
      - name: Validar dados e comparações
        run: npm run check && npm test
      - name: Salvar catálogo atualizado
        run: |
          git config user.name "rota-leve[bot]"
          git config user.email "rota-leve[bot]@users.noreply.github.com"
          git add site/data/offers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: atualizar preços anunciados"
          # O agente local publica no mesmo horário. Se a main mudou, coleta de novo sobre a versão
          # nova em vez de sobrescrevê-la; o catálogo junta as observações dos dois lados.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            npm run collect
            npm run check
            git add site/data/offers.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: atualizar preços anunciados"
          done
          echo "::error::A main mudou durante as três tentativas de publicar o catálogo."
          exit 1
